limit_req_zone $binary_remote_addr zone=privacy_registration:64k rate=10r/m;
server {
    listen 172.31.255.1:8085;
    server_name 172.31.255.1;
    root /www;
    allow 172.31.255.0/24;
    deny all;
    access_log off;
    client_max_body_size 2k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    if ($host != 172.31.255.1) { return 302 http://172.31.255.1:8085/; }
    include conf.d/luci.locations;
    location = / {
        root /www/privacy-register;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
    location = /cgi-bin/privacy-register {
        limit_req zone=privacy_registration burst=5 nodelay;
        limit_req_status 429;
        include uwsgi_params;
        uwsgi_param SERVER_ADDR $server_addr;
        uwsgi_modifier1 9;
        uwsgi_read_timeout 20s;
        uwsgi_pass unix:////var/run/luci-webui.socket;
    }
    location / { return 302 http://172.31.255.1:8085/; }
}
