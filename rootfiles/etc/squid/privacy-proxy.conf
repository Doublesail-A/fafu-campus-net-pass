# Bootstrap only. The manager replaces this after the first node import.
http_port 172.31.255.1:3132 intercept name=privacy-proxy-http
https_port 172.31.255.1:3131 intercept ssl-bump cert=/etc/squid/ca.pem generate-host-certificates=off dynamic_cert_mem_cache_size=1MB name=privacy-proxy-https
acl privacy_proxy_listener myportname privacy-proxy-http privacy-proxy-https
http_access deny privacy_proxy_listener
