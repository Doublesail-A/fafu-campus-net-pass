http_port 172.31.255.1:3129 intercept
https_port 172.31.255.1:3130 intercept ssl-bump cert=/etc/squid/ca.pem generate-host-certificates=off dynamic_cert_mem_cache_size=1MB
ssl_bump splice all
acl localnet src 172.31.255.0/24
request_header_access User-Agent deny all
request_header_replace User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"
http_access allow localnet
http_access deny all
cache deny all
access_log /dev/null
include /etc/squid/privacy-proxy.conf
max_filedescriptors 2048
workers 2
cache_mem 0 MB
